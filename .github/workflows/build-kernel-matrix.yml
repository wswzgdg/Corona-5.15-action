name: 全量构建内核

env:
  TZ: Asia/Shanghai
  CCACHE_KEY: ccache-ecsv3-5.15

on:
  workflow_dispatch:
    inputs:
      build_sukisu:
        description: "编译 SukiSU"
        required: true
        type: boolean
        default: true
      build_resukisu:
        description: "编译 ReSukiSU"
        required: true
        type: boolean
        default: true
      build_ksunext:
        description: "编译 KSUNEXT"
        required: true
        type: boolean
        default: false
      build_ksu:
        description: "编译 KSU"
        required: true
        type: boolean
        default: true
      build_kowsu:
        description: "编译 KowSU"
        required: true
        type: boolean
        default: false
      build_none:
        description: "编译 无管理器"
        required: true
        type: boolean
        default: true
      common_commit:
        description: "common 仓库提交哈希（留空=最新）"
        required: false
        type: string
        default: ''
      build_susfs:
        description: "启用 SUSFS"
        required: true
        type: choice
        default: 'true'
        options:
          - 'false'
          - 'true'
          - 'both'
      clang_version:
        description: "LLVM/Clang 版本"
        required: false
        type: choice
        options:
          - '14'
          - '22'
          - '23'
        default: '23'
      android_release:
        description: "Android 版本"
        required: true
        type: choice
        options:
          - '15'
          - '16'
        default: '16'
      droidspaces_enable:
        description: "启用 Droidspaces 容器支持"
        required: true
        type: boolean
        default: true
      use_kpn:
        description: "使用 KP-N patch 内核镜像"
        required: false
        type: boolean
        default: false
      pre_release:
        description: "作为预发布"
        required: false
        type: boolean
        default: true
      version_name:
        description: "KSU 版本名主体"
        required: false
        type: string
        default: "SEX"
      kernel_suffix:
        description: "设置内核后缀"
        required: false
        type: string
        default: ""

jobs:
  count-builds:
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.count.outputs.total }}
      use_prepared: ${{ steps.count.outputs.use_prepared }}
    steps:
      - name: 计算实际编译数
        id: count
        env:
          B_RESUKISU: ${{ inputs.build_resukisu }}
          B_SUKISU: ${{ inputs.build_sukisu }}
          B_KSUNEXT: ${{ inputs.build_ksunext }}
          B_KSU: ${{ inputs.build_ksu }}
          B_KOWSU: ${{ inputs.build_kowsu }}
          B_NONE: ${{ inputs.build_none }}
          B_SUSFS: ${{ inputs.build_susfs }}
        run: |
          total=0
          if [ "$B_SUSFS" = "both" ]; then mgr_factor=2; else mgr_factor=1; fi
          for var in B_RESUKISU B_SUKISU B_KSUNEXT B_KSU B_KOWSU; do
            if [ "${!var}" = "true" ]; then total=$((total + mgr_factor)); fi
          done
          if [ "$B_NONE" = "true" ]; then total=$((total + 1)); fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          if [ "$total" -ge 3 ]; then
            echo "use_prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_prepared=false" >> "$GITHUB_OUTPUT"
          fi
          echo "本次共需编译 $total 个矩阵项，use_prepared=$( [ $total -ge 3 ] && echo true || echo false )"

  vendor-hash:
    needs: count-builds
    if: ${{ needs.count-builds.outputs.use_prepared == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.h.outputs.hash }}
    steps:
      - name: 解析 vendor 仓库哈希
        id: h
        env:
          ANDROID_RELEASE: ${{ inputs.android_release }}
          VENDOR_URL: https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8550
        run: |
          if [ "$ANDROID_RELEASE" = "15" ]; then
            BRANCH="oneplus/sm8550_v_15.0.0_oneplus11"
          else
            BRANCH="oneplus/sm8550_b_16.0.0_oneplus_11"
          fi
          VENDOR_SHA=$(git ls-remote "$VENDOR_URL" "$BRANCH" | awk 'NR==1{print $1}')
          if [ -z "$VENDOR_SHA" ]; then
            echo "::error::无法解析 vendor HEAD ($BRANCH)"
            exit 1
          fi
          HASH=$(printf '%s\n%s\n%s\n' "$VENDOR_SHA" "$ANDROID_RELEASE" "$BRANCH" | sha256sum | cut -c1-12)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          {
            echo "vendor=$VENDOR_SHA"
            echo "android_release=$ANDROID_RELEASE"
            echo "branch=$BRANCH"
            echo "vendor_hash=$HASH"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-source:
    needs: [count-builds, vendor-hash]
    if: ${{ needs.count-builds.outputs.use_prepared == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PREPARED_KEY: prepared-Linux-a${{ inputs.android_release }}-${{ needs.vendor-hash.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 载入 prepared-workspace 缓存
        uses: actions/cache/restore@v5
        id: prepared-restore
        with:
          path: ${{ github.workspace }}/kernel_workspace.tar.zst
          key: ${{ env.PREPARED_KEY }}

      - name: 计算缓存命中状态
        id: gate
        run: |
          if [ "${{ steps.prepared-restore.outputs.cache-hit }}" = "true" ]; then
            echo "需要同步=否（命中 prepared-workspace 缓存）"
            echo "need_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "需要同步=是（缓存未命中）"
            echo "need_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步 vendor 源码
        if: ${{ steps.gate.outputs.need_sync == 'true' }}
        env:
          ANDROID_RELEASE: ${{ inputs.android_release }}
        run: |
          chmod +x .github/workflows/all_managers/prepare_source.sh
          .github/workflows/all_managers/prepare_source.sh

      - name: 打包 workspace
        if: ${{ steps.gate.outputs.need_sync == 'true' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          tar -I 'zstd -T0 -3' -cf kernel_workspace.tar.zst kernel_workspace
          ls -lh kernel_workspace.tar.zst

      - name: 覆盖同 key 的 prepared-workspace 缓存
        if: ${{ always() && steps.gate.outputs.need_sync == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHE_KEY: ${{ env.PREPARED_KEY }}
        run: |
          if gh cache delete "$CACHE_KEY" -R "${{ github.repository }}"; then
            echo "已删除旧的 prepared-workspace 缓存: $CACHE_KEY"
          else
            echo "旧的 prepared-workspace 缓存不存在，直接保存新缓存"
          fi

      - name: 保存 prepared-workspace 缓存
        if: ${{ always() && steps.gate.outputs.need_sync == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace.tar.zst
          key: ${{ env.PREPARED_KEY }}

      - name: 校验 tarball 已就绪
        run: |
          if [ ! -s "$GITHUB_WORKSPACE/kernel_workspace.tar.zst" ]; then
            echo "::error::kernel_workspace.tar.zst 不存在或为空"
            exit 1
          fi
          ls -lh "$GITHUB_WORKSPACE/kernel_workspace.tar.zst"

      - name: 上传 workspace artifact
        uses: actions/upload-artifact@v7
        with:
          name: prepared-workspace
          path: ${{ github.workspace }}/kernel_workspace.tar.zst
          retention-days: 1
          compression-level: 0

      - name: 清理上次 run 的 common ccache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMON_KEY: ccache-ecsv3-5.15-a${{ inputs.android_release }}-Linux-${{ github.ref_name }}-common
        run: |
          if gh cache delete "$COMMON_KEY" -R "${{ github.repository }}"; then
            echo "已删除上次 run 的 common ccache: $COMMON_KEY"
          else
            echo "上次 common ccache 不存在，无需清理"
          fi
  build-resukisu:
    needs: [count-builds, prepare-source]
    if: ${{ always() && needs.count-builds.result == 'success' && (needs.prepare-source.result == 'success' || needs.prepare-source.result == 'skipped') && inputs.build_resukisu }}
    permissions:
      actions: write
      contents: read
      packages: read
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        susfs: ${{ inputs.build_susfs == 'both' && fromJSON('[true, false]') || (inputs.build_susfs == 'true' && fromJSON('[true]') || fromJSON('[false]')) }}
    uses: ./.github/workflows/kernel-build.yml
    with:
      manager: resukisu
      kernel_suffix: ${{ inputs.kernel_suffix }}
      susfs: ${{ matrix.susfs }}
      susfs_mode: ${{ inputs.build_susfs }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      ccache_key: 'ccache-ecsv3-5.15'
      use_kpn: ${{ inputs.use_kpn }}
      version_name: ${{ inputs.version_name }}
      common_commit: ${{ inputs.common_commit }}
      android_release: ${{ inputs.android_release }}
      clang_version: ${{ inputs.clang_version }}
      use_prepared_source: ${{ needs.count-builds.outputs.use_prepared == 'true' }}
      build_enabled: true
    secrets: inherit

  build-sukisu:
    needs: [count-builds, prepare-source]
    if: ${{ always() && needs.count-builds.result == 'success' && (needs.prepare-source.result == 'success' || needs.prepare-source.result == 'skipped') && inputs.build_sukisu }}
    permissions:
      actions: write
      contents: read
      packages: read
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        susfs: ${{ inputs.build_susfs == 'both' && fromJSON('[true, false]') || (inputs.build_susfs == 'true' && fromJSON('[true]') || fromJSON('[false]')) }}
    uses: ./.github/workflows/kernel-build.yml
    with:
      manager: sukisu
      kernel_suffix: ${{ inputs.kernel_suffix }}
      susfs: ${{ matrix.susfs }}
      susfs_mode: ${{ inputs.build_susfs }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      ccache_key: 'ccache-ecsv3-5.15'
      use_kpn: ${{ inputs.use_kpn }}
      version_name: ${{ inputs.version_name }}
      android_release: ${{ inputs.android_release }}
      clang_version: ${{ inputs.clang_version }}
      use_prepared_source: ${{ needs.count-builds.outputs.use_prepared == 'true' }}
      build_enabled: true
    secrets: inherit

  build-ksunext:
    needs: [count-builds, prepare-source]
    if: ${{ always() && needs.count-builds.result == 'success' && (needs.prepare-source.result == 'success' || needs.prepare-source.result == 'skipped') && inputs.build_ksunext }}
    permissions:
      actions: write
      contents: read
      packages: read
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        susfs: ${{ inputs.build_susfs == 'both' && fromJSON('[true, false]') || (inputs.build_susfs == 'true' && fromJSON('[true]') || fromJSON('[false]')) }}
    uses: ./.github/workflows/kernel-build.yml
    with:
      manager: ksunext
      kernel_suffix: ${{ inputs.kernel_suffix }}
      susfs: ${{ matrix.susfs }}
      susfs_mode: ${{ inputs.build_susfs }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      ccache_key: 'ccache-ecsv3-5.15'
      use_kpn: ${{ inputs.use_kpn }}
      version_name: ${{ inputs.version_name }}
      android_release: ${{ inputs.android_release }}
      clang_version: ${{ inputs.clang_version }}
      use_prepared_source: ${{ needs.count-builds.outputs.use_prepared == 'true' }}
      build_enabled: true
    secrets: inherit

  build-ksu:
    needs: [count-builds, prepare-source]
    if: ${{ always() && needs.count-builds.result == 'success' && (needs.prepare-source.result == 'success' || needs.prepare-source.result == 'skipped') && inputs.build_ksu }}
    permissions:
      actions: write
      contents: read
      packages: read
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        susfs: ${{ inputs.build_susfs == 'both' && fromJSON('[true, false]') || (inputs.build_susfs == 'true' && fromJSON('[true]') || fromJSON('[false]')) }}
    uses: ./.github/workflows/kernel-build.yml
    with:
      manager: ksu
      kernel_suffix: ${{ inputs.kernel_suffix }}
      susfs: ${{ matrix.susfs }}
      susfs_mode: ${{ inputs.build_susfs }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      ccache_key: 'ccache-ecsv3-5.15'
      use_kpn: ${{ inputs.use_kpn }}
      version_name: ${{ inputs.version_name }}
      android_release: ${{ inputs.android_release }}
      clang_version: ${{ inputs.clang_version }}
      use_prepared_source: ${{ needs.count-builds.outputs.use_prepared == 'true' }}
      build_enabled: true
    secrets: inherit

  build-kowsu:
    needs: [count-builds, prepare-source]
    if: ${{ always() && needs.count-builds.result == 'success' && (needs.prepare-source.result == 'success' || needs.prepare-source.result == 'skipped') && inputs.build_kowsu }}
    permissions:
      actions: write
      contents: read
      packages: read
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        susfs: ${{ inputs.build_susfs == 'both' && fromJSON('[true, false]') || (inputs.build_susfs == 'true' && fromJSON('[true]') || fromJSON('[false]')) }}
    uses: ./.github/workflows/kernel-build.yml
    with:
      manager: kowsu
      kernel_suffix: ${{ inputs.kernel_suffix }}
      susfs: ${{ matrix.susfs }}
      susfs_mode: ${{ inputs.build_susfs }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      ccache_key: 'ccache-ecsv3-5.15'
      use_kpn: ${{ inputs.use_kpn }}
      version_name: ${{ inputs.version_name }}
      android_release: ${{ inputs.android_release }}
      clang_version: ${{ inputs.clang_version }}
      use_prepared_source: ${{ needs.count-builds.outputs.use_prepared == 'true' }}
      build_enabled: true
    secrets: inherit

  build-none:
    needs: [count-builds, prepare-source]
    if: ${{ always() && needs.count-builds.result == 'success' && (needs.prepare-source.result == 'success' || needs.prepare-source.result == 'skipped') && inputs.build_none }}
    permissions:
      actions: write
      contents: read
      packages: read
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        susfs: ${{ inputs.build_susfs == 'both' && fromJSON('[true, false]') || (inputs.build_susfs == 'true' && fromJSON('[true]') || fromJSON('[false]')) }}
    uses: ./.github/workflows/kernel-build.yml
    with:
      manager: none
      kernel_suffix: ${{ inputs.kernel_suffix }}
      susfs: ${{ matrix.susfs }}
      susfs_mode: ${{ inputs.build_susfs }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      ccache_key: 'ccache-ecsv3-5.15'
      use_kpn: ${{ inputs.use_kpn }}
      version_name: ${{ inputs.version_name }}
      android_release: ${{ inputs.android_release }}
      clang_version: ${{ inputs.clang_version }}
      use_prepared_source: ${{ needs.count-builds.outputs.use_prepared == 'true' }}
      build_enabled: true
    secrets: inherit
  release:
    if: always()
    needs: [build-resukisu, build-sukisu, build-ksunext, build-ksu, build-kowsu, build-none]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 下载全部内核镜像
        uses: actions/download-artifact@v8
        with:
          path: ./kernel_images
          pattern: kernel-Image-*
          merge-multiple: false

      - name: 下载 clang 元数据工件
        uses: actions/download-artifact@v8
        with:
          path: ./clang_meta
          pattern: clang-meta-*
          merge-multiple: true

      - name: 打包 AnyKernel3 ZIP
        env:
          AK3_TOKEN: ${{ secrets.AK3_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/workflows/all_managers/packaging.sh
          AK3_URL="https://github.com/Corona-oplus-kernel/AnyKernel3"
          [ -n "${AK3_TOKEN:-}" ] && AK3_URL="https://${AK3_TOKEN}@github.com/Corona-oplus-kernel/AnyKernel3"
          CORONA_URL="https://github.com/Corona-oplus-kernel/Corona_module"
          mkdir -p release_zips
          for img_dir in kernel_images/*/; do
            [ -d "$img_dir" ] || continue
            name=$(basename "$img_dir")
            manager="${name#kernel-Image-}"
            case "$name" in
              *-susfs) susfs_label="SUSFS"; manager="${manager%-susfs}" ;;
              *-nosusfs) susfs_label=""; manager="${manager%-nosusfs}" ;;
              *) susfs_label="" ;;
            esac
            [ -f "${img_dir}Image" ] || continue
            prepare_anykernel_tree "$manager" "false" "$AK3_URL" "$CORONA_URL"
            package_anykernel_zip "$manager" "5.15" "${img_dir}Image" "$(pwd)/release_zips" "noksu" "$susfs_label" >/dev/null
            rm -rf AnyKernel3
          done

      - name: 检查是否存在 ZIP 产物
        id: release_zips_check
        continue-on-error: true
        run: |
          if compgen -G "release_zips/AK3-*.zip" > /dev/null; then
            echo "has_zips=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_zips=false" >> "$GITHUB_OUTPUT"
            echo "::error::未找到可发布的 ZIP 产物"
            exit 1
          fi

      - name: 记录成功发包的管理器
        if: ${{ steps.release_zips_check.outputs.has_zips == 'true' }}
        run: |
          python3 .github/workflows/all_managers/release_metadata.py collect-artifacts

      - name: 获取上一版发布元数据
        if: ${{ steps.release_zips_check.outputs.has_zips == 'true' }}
        id: previous_release
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 20,
              });
              const stable = releases.find(r => !r.prerelease && !r.draft);
              if (!stable) {
                core.setOutput('body_b64', '');
                return;
              }
              core.setOutput('body_b64', Buffer.from(stable.body || '', 'utf8').toString('base64'));
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('body_b64', '');
                return;
              }
              throw error;
            }

      - name: 生成发布描述
        if: ${{ steps.release_zips_check.outputs.has_zips == 'true' }}
        env:
          PREVIOUS_RELEASE_BODY_B64: ${{ steps.previous_release.outputs.body_b64 }}
          KERNEL_COMMON_TOKEN: ${{ secrets.KERNEL_COMMON_TOKEN }}
          IS_PRERELEASE: ${{ inputs.pre_release }}
          BUILD_RESUKISU: ${{ inputs.build_resukisu }}
          BUILD_SUKISU: ${{ inputs.build_sukisu }}
          BUILD_KSUNEXT: ${{ inputs.build_ksunext }}
          BUILD_KSU: ${{ inputs.build_ksu }}
          BUILD_KOWSU: ${{ inputs.build_kowsu }}
          BUILD_NONE: ${{ inputs.build_none }}
          BUILD_SUSFS: ${{ inputs.build_susfs }}
          BUILD_DROIDSPACES: ${{ inputs.droidspaces_enable }}
          BUILD_ANDROID_RELEASE: ${{ inputs.android_release }}
          BUILD_USE_KPN: ${{ inputs.use_kpn }}
        run: |
          python3 .github/workflows/all_managers/release_metadata.py generate-release-body

      - name: 发布 ZIP 包
        if: ${{ steps.release_zips_check.outputs.has_zips == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: all-managers-${{ github.run_id }}
          PRERELEASE_FLAG: ${{ inputs.pre_release && '--prerelease' || '' }}
        run: |
          CLANG_LABEL="$(cat ./clang_version_label.txt 2>/dev/null || printf 'unknown')"
          SUSFS_LABEL="${{ inputs.build_susfs == 'both' && 'both' || (inputs.build_susfs == 'true' && 'on' || 'off') }}"
          DROIDSPACES_LABEL="${{ inputs.droidspaces_enable && 'on' || 'off' }}"
          PREFIX="${{ inputs.pre_release == true && '预发布 | ' || '' }}"
          RELEASE_NAME="${PREFIX}全量构建 #${{ github.run_number }} | A${{ inputs.android_release }} | susfs:${SUSFS_LABEL} | ds:${DROIDSPACES_LABEL} | clang:${CLANG_LABEL}"
          gh release create "$TAG_NAME" ./release_zips/*.zip \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_NAME" \
            --notes-file ./release_body.md \
            $PRERELEASE_FLAG
