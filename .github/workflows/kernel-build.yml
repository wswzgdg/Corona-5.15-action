name: Kernel Build (Reusable)

on:
  workflow_call:
    inputs:
      manager:
        description: 'ROOT manager type'
        required: true
        type: string
      kernel_suffix:
        description: '内核后缀'
        required: false
        type: string
      susfs:
        description: '是否启用 SUSFS'
        required: false
        type: boolean
        default: true
      droidspaces_enable:
        description: '是否启用 Droidspaces 容器支持'
        required: false
        type: string
        default: 'false'
      susfs_mode:
        description: 'SUSFS 模式 (false/true/both)，仅用于命名'
        required: false
        type: string
        default: ''
      ccache_update:
        description: '是否覆盖更新 ccache 缓存'
        required: false
        type: boolean
        default: false
      ccache_key:
        description: 'ccache 缓存键前缀'
        required: false
        type: string
        default: 'ccache-ecsv3-5.15'
      use_kpn:
        description: '是否在编译后使用 KP-N patch 内核镜像'
        required: false
        type: boolean
        default: false
      android_release:
        description: 'Android 版本'
        required: false
        type: string
        default: '16'
      version_name:
        description: 'KSU 版本名主体'
        required: false
        type: string
        default: 'eternitylonely'
      clang_version:
        description: 'LLVM/Clang 版本'
        required: false
        type: string
        default: '23'
      build_enabled:
        description: '是否执行该 manager'
        required: false
        type: boolean
        default: true
      allow_fail:
        description: '单个管理器失败不算错误'
        required: false
        type: boolean
        default: false
      use_prepared_source:
        description: '是否使用 prepare-source 预备好的 workspace artifact'
        required: false
        type: boolean
        default: false
      builder_image:
        description: '预构建镜像 (ghcr.io/...:tag)，默认指向本仓库的 builder image'
        required: false
        type: string
        default: ''

jobs:
  build-kernel:
    if: ${{ inputs.build_enabled }}
    continue-on-error: ${{ inputs.allow_fail }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: read
    container:
      image: ${{ inputs.builder_image != '' && inputs.builder_image || 'ghcr.io/wswzgdg/corona-5.15-action-builder:clang23' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OWN_KEY: ${{ inputs.ccache_key }}-a${{ inputs.android_release }}-Linux-${{ github.ref_name }}-${{ inputs.susfs && 'on' || 'off' }}-${{ inputs.droidspaces_enable != 'false' && 'droidspaces' || 'none' }}-${{ inputs.manager }}
      COMMON_KEY: ${{ inputs.ccache_key }}-a${{ inputs.android_release }}-Linux-${{ github.ref_name }}-common
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 配置 ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_5.15" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache_5.15"

      - name: 下载预备 workspace
        if: ${{ inputs.use_prepared_source }}
        uses: actions/download-artifact@v8
        with:
          name: prepared-workspace
          path: ${{ github.workspace }}

      - name: 解压预备 workspace
        if: ${{ inputs.use_prepared_source }}
        run: |
          cd "$GITHUB_WORKSPACE"
          tar -I 'zstd -T0' -xf kernel_workspace.tar.zst
          rm -f kernel_workspace.tar.zst
          ls -la kernel_workspace

      - name: 载入 own ccache 缓存
        uses: actions/cache/restore@v5
        id: ccache-own
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.OWN_KEY }}

      - name: 载入 common ccache 缓存
        if: ${{ steps.ccache-own.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v5
        id: ccache-common
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.COMMON_KEY }}

      - name: 拉取公共预置 ccache 缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "$CCACHE_DIR" ] && [ "$(ls -A "$CCACHE_DIR" 2>/dev/null)" ]; then
            echo "已命中 own/common 缓存，跳过 public 拉取"
            exit 0
          fi
          echo "own/common 均未命中，尝试拉取最新 public ccache ..."
          mkdir -p "$CCACHE_DIR"
          FILE_NAME="ccache-5.15.tar.zst"
          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "成功下载 $FILE_NAME，正在解压..."
            tar -I zstd -xf "$FILE_NAME" -C "$CCACHE_DIR"
            rm -f "$FILE_NAME"
            echo "public ccache 恢复完成"
          else
            echo "public ccache 不存在，将进行全新编译"
          fi

      - name: 读取上次命中率基线
        id: prev_rate
        run: |
          if [ -f "$CCACHE_DIR/.prev_hit_rate.txt" ]; then
            VAL="$(cat "$CCACHE_DIR/.prev_hit_rate.txt" 2>/dev/null || echo 0)"
          else
            VAL="0"
          fi
          [ -n "$VAL" ] || VAL="0"
          echo "上次 own 缓存命中率基线: $VAL%"
          echo "value=$VAL" >> "$GITHUB_OUTPUT"

      - name: 准备工具链
        env:
          CLANG_VERSION: ${{ inputs.clang_version }}
        run: |
          source .github/workflows/all_managers/toolchain.sh
          ensure_toolchain "$CLANG_VERSION" "$GITHUB_WORKSPACE"

      - name: 安装 ccache ECS
        run: |
          cp -f ./lib/ccache-x86-64 /usr/bin/ccache
          chmod +x /usr/bin/ccache
          ccache --version | head -n 1

      - name: 初始化 ccache
        run: |
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -o compression=true
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"
          echo "ccache 初始状态:"
          ccache -s

      - name: 编译内核
        id: compile
        continue-on-error: true
        env:
          KERNEL_COMMON_TOKEN: ${{ secrets.KERNEL_COMMON_TOKEN }}
          AK3_TOKEN: ${{ secrets.AK3_TOKEN }}
          ANDROID_VERSION: android13
          KERNEL_VERSION: '5.15'
          ANDROID_RELEASE: ${{ inputs.android_release }}
          DROIDSPACES_ENABLE: ${{ inputs.droidspaces_enable }}
          BUILD_SUSFS_MODE: ${{ inputs.susfs_mode }}
          CLANG_VERSION: ${{ inputs.clang_version }}
          SKIP_APT: '1'
          SKIP_SOURCE_PREP: ${{ inputs.use_prepared_source && '1' || '' }}
          CCACHE_COMPILERCHECK: none
          CCACHE_NOHASHDIR: true
          CCACHE_NOHARDLINK: true
          CCACHE_IS_KERNEL_COMPILING: true
        run: |
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_LOGFILE="$GITHUB_WORKSPACE/kernel_workspace/ccache.log"
          mkdir -p "$(dirname "$CCACHE_LOGFILE")"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"
          chmod +x .github/workflows/all_managers/common.sh
          .github/workflows/all_managers/common.sh "${{ inputs.manager }}" "${{ inputs.kernel_suffix }}" "${{ inputs.susfs && 'on' || 'off' }}" "${{ inputs.use_kpn && 'true' || 'false' }}" "${{ inputs.version_name }}"
          echo "ccache 状态："
          ccache -s

      - name: 计算本次命中率
        if: ${{ always() }}
        id: cur_rate
        run: |
          HITS=""
          TOTAL=""
          if PRINT_STATS="$(ccache --print-stats 2>/dev/null)" && [ -n "$PRINT_STATS" ]; then
            HITS="$(printf '%s\n' "$PRINT_STATS" | awk '$1=="cache_hit_direct"||$1=="cache_hit_preprocessed"{s+=$2} END{print s+0}')"
            MISS="$(printf '%s\n' "$PRINT_STATS" | awk '$1=="cache_miss"{print $2; exit}')"
            [ -n "$MISS" ] || MISS=0
            TOTAL=$((HITS + MISS))
          fi
          if [ -z "$HITS" ] || [ -z "$TOTAL" ] || [ "$TOTAL" = "0" ]; then
            STATS="$(ccache -s 2>/dev/null || true)"
            HITS="$(printf '%s\n' "$STATS" | awk '/^[[:space:]]*Hits:/ {print $2; exit}')"
            TOTAL="$(printf '%s\n' "$STATS" | awk '/^[[:space:]]*Cacheable calls:/ {print $3; exit}')"
          fi
          if [ -z "$HITS" ] || [ -z "$TOTAL" ] || [ "$TOTAL" = "0" ]; then
            RATE="0"
          else
            RATE="$(awk -v h="$HITS" -v t="$TOTAL" 'BEGIN{ printf "%.2f", h*100/t }')"
          fi
          echo "本次命中率: $RATE% (hits=$HITS / total=$TOTAL)"
          echo "value=$RATE" >> "$GITHUB_OUTPUT"
          printf '%s' "$RATE" > "$CCACHE_DIR/.prev_hit_rate.txt"

      - name: 决定 own 缓存写入策略
        if: ${{ always() && steps.compile.outcome == 'success' }}
        id: own_decision
        env:
          PREV: ${{ steps.prev_rate.outputs.value }}
          CUR: ${{ steps.cur_rate.outputs.value }}
          OWN_HIT: ${{ steps.ccache-own.outputs.cache-hit }}
          FORCE_UPDATE: ${{ inputs.ccache_update }}
        run: |
          DECISION="skip"
          REASON=""
          if [ "$FORCE_UPDATE" = "true" ]; then
            DECISION="overwrite"
            REASON="ccache_update=true"
          elif [ "$OWN_HIT" != "true" ]; then
            DECISION="save"
            REASON="own 缓存首次写入"
          else
            CMP="$(awk -v p="$PREV" -v c="$CUR" 'BEGIN{ if (c+0 > p+0) print "gt"; else print "le" }')"
            if [ "$CMP" = "gt" ]; then
              DECISION="overwrite"
              REASON="本次命中率 $CUR% > 上次 $PREV%"
            else
              REASON="本次命中率 $CUR% 未优于上次 $PREV%，保留旧 own 缓存"
            fi
          fi
          echo "own 写入决定: $DECISION ($REASON)"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"

      - name: 删除旧 own 缓存
        if: ${{ always() && steps.own_decision.outputs.decision == 'overwrite' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh cache delete "$OWN_KEY" -R "${{ github.repository }}"; then
            echo "已删除旧 own 缓存: $OWN_KEY"
          else
            echo "旧 own 缓存不存在，直接保存"
          fi

      - name: 保存 own ccache 缓存
        if: ${{ always() && (steps.own_decision.outputs.decision == 'save' || steps.own_decision.outputs.decision == 'overwrite') }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.OWN_KEY }}

      - name: 保存 common ccache 缓存
        if: ${{ always() && steps.compile.outcome == 'success' && inputs.use_prepared_source }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.COMMON_KEY }}

      - name: 记录 clang 版本元数据
        if: ${{ always() }}
        env:
          CLANG_VERSION_INPUT: ${{ inputs.clang_version }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/clang_meta"
          if [ "$CLANG_VERSION_INPUT" = "23" ]; then
            CLANG_BIN="$GITHUB_WORKSPACE/clang23/llvm-23/bin/clang"
          elif [ "$CLANG_VERSION_INPUT" = "14" ]; then
            CLANG_BIN="$GITHUB_WORKSPACE/clang14/clang-r450784d/bin/clang"
          else
            CLANG_BIN="$GITHUB_WORKSPACE/clang22/LLVM-22.1.0-Linux-X64/bin/clang"
          fi
          CLANG_LABEL_RAW="$($CLANG_BIN -v 2>&1 | grep 'clang version' | head -n 1)"
          CLANG_LABEL_VERSION="$(printf '%s' "$CLANG_LABEL_RAW" | grep -oE '[0-9]+(\.[0-9]+){0,2}' | head -n 1)"
          [ -n "$CLANG_LABEL_VERSION" ] || CLANG_LABEL_VERSION="$CLANG_VERSION_INPUT"
          printf '%s' "$CLANG_LABEL_VERSION" > "$GITHUB_WORKSPACE/clang_meta/${{ inputs.manager }}.txt"

      - name: 上传 ZIP 工件
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('ak3-{0}{1}', inputs.manager == 'none' && 'noksu' || inputs.manager, (inputs.susfs_mode == 'both' && inputs.manager != 'none') && (inputs.susfs && '-susfs' || '-nosusfs') || '') }}
          path: ${{ github.workspace }}/out_zips/AK3-*.zip

      - name: 上传 clang 元数据工件
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('clang-meta-{0}{1}', inputs.manager, (inputs.susfs_mode == 'both' && inputs.manager != 'none') && (inputs.susfs && '-susfs' || '-nosusfs') || '') }}
          path: ${{ github.workspace }}/clang_meta/${{ inputs.manager }}.txt
