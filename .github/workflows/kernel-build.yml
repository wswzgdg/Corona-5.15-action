name: Kernel Build (Reusable)

on:
  workflow_call:
    inputs:
      manager:
        description: 'ROOT manager type'
        required: true
        type: string
      common_commit:
        description: 'common 仓库提交哈希（留空=最新）'
        required: false
        type: string
        default: ''
      kernel_suffix:
        description: '内核后缀'
        required: false
        type: string
      susfs:
        description: '是否启用 SUSFS'
        required: false
        type: boolean
        default: true
      droidspaces_enable:
        description: '是否启用 Droidspaces 容器支持'
        required: false
        type: boolean
        default: true
      susfs_mode:
        description: 'SUSFS 模式 (false/true/both)，仅用于命名'
        required: false
        type: string
        default: ''
      ccache_key:
        description: 'ccache 缓存键前缀'
        required: false
        type: string
        default: 'ccache-ecsv3-5.15'
      use_kpn:
        description: '是否在编译后使用 KP-N patch 内核镜像'
        required: false
        type: boolean
        default: false
      android_release:
        description: 'Android 版本'
        required: false
        type: string
        default: '16'
      version_name:
        description: 'KSU 版本名主体'
        required: false
        type: string
        default: 'eternitylonely'
      clang_version:
        description: 'LLVM/Clang 版本'
        required: false
        type: string
        default: '23'
      build_enabled:
        description: '是否执行该 manager'
        required: false
        type: boolean
        default: true
      allow_fail:
        description: '单个管理器失败不算错误'
        required: false
        type: boolean
        default: false
      use_prepared_source:
        description: '是否使用 prepare-source 预备好的 workspace artifact'
        required: false
        type: boolean
        default: false

jobs:
  build-kernel:
    if: ${{ inputs.build_enabled }}
    continue-on-error: ${{ inputs.allow_fail }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        shell: bash
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CCACHE_DIR: ${{ github.workspace }}/.ccache_5.15
      CCACHE_MAXSIZE: 5G
      CCACHE_BASEDIR: ${{ github.workspace }}
      OWN_KEY: ${{ inputs.ccache_key }}-a${{ inputs.android_release }}-Linux-${{ github.ref_name }}-${{ inputs.susfs && 'on' || 'off' }}-${{ inputs.droidspaces_enable && 'droidspaces' || 'none' }}-${{ inputs.manager }}
      COMMON_KEY: ${{ inputs.ccache_key }}-a${{ inputs.android_release }}-Linux-${{ github.ref_name }}-common
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: 安装系统依赖
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq --no-install-recommends \
            binutils python-is-python3 ccache \
            flex bison dwarves libssl-dev libelf-dev bc make cmake \
            zip aria2 gnupg gawk rsync \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            tar gzip xz-utils bzip2 zstd device-tree-compiler libc6-dev-i386 \
            gh patch git-lfs curl wget ca-certificates

      - name: 恢复工具链缓存
        id: cache-toolchains
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/clang14
            ${{ github.workspace }}/clang22
            ${{ github.workspace }}/clang23
          key: toolchains-${{ runner.os }}

      - name: 恢复 ThinLTO 缓存
        id: restore-thinlto
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
          key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ inputs.manager }}

      - name: 下载预备 workspace
        if: ${{ inputs.use_prepared_source }}
        uses: actions/download-artifact@v8
        with:
          name: prepared-workspace
          path: ${{ github.workspace }}

      - name: 解压预备 workspace
        if: ${{ inputs.use_prepared_source }}
        run: |
          cd "$GITHUB_WORKSPACE"
          tar -I 'zstd -T0' -xf kernel_workspace.tar.zst
          rm -f kernel_workspace.tar.zst
          ls -la kernel_workspace

      - name: 载入 own ccache 缓存
        uses: actions/cache/restore@v5
        id: ccache-own
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.OWN_KEY }}

      - name: 载入 common ccache 缓存
        if: ${{ steps.ccache-own.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v5
        id: ccache-common
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.COMMON_KEY }}

      - name: 拉取公共预置 ccache 缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "$CCACHE_DIR" ] && [ "$(ls -A "$CCACHE_DIR" 2>/dev/null)" ]; then
            echo "已命中 own/common 缓存，跳过 public 拉取"
            exit 0
          fi
          echo "own/common 均未命中，尝试拉取最新 public ccache ..."
          mkdir -p "$CCACHE_DIR"
          FILE_NAME="ccache-5.15.tar.zst"
          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "成功下载 $FILE_NAME，正在解压..."
            tar -I zstd -xf "$FILE_NAME" -C "$CCACHE_DIR"
            rm -f "$FILE_NAME"
            echo "public ccache 恢复完成"
          else
            echo "public ccache 不存在，将进行全新编译"
          fi

      - name: 准备工具链
        env:
          CLANG_VERSION: ${{ inputs.clang_version }}
        run: |
          source .github/workflows/all_managers/toolchain.sh
          ensure_toolchain "$CLANG_VERSION" "$GITHUB_WORKSPACE"
          # 将符号链接替换为实际文件，以便 actions/cache 可以缓存
          for d in "$GITHUB_WORKSPACE"/clang14 "$GITHUB_WORKSPACE"/clang22 "$GITHUB_WORKSPACE"/clang23; do
            [ -d "$d" ] || continue
            for sub in "$d"/*; do
              if [ -L "$sub" ]; then
                real="$(readlink -f "$sub")"
                rm -f "$sub"
                cp -aL "$real" "$sub" 2>/dev/null || true
              fi
            done
          done
          echo "工具链就绪"
          ls -la "$GITHUB_WORKSPACE"/clang*/ 2>/dev/null | head -20

      - name: 初始化 ccache
        run: |
          # 替换为 ECS 版 ccache（如已安装同版本则跳过）
          if ! ccache --version 2>/dev/null | grep -q "4\.10\.2"; then
            sudo cp -f ./lib/ccache-x86-64 /usr/bin/ccache
            sudo chmod +x /usr/bin/ccache
          fi
          ccache --version | head -n 1
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"
          echo "ccache 初始状态:"
          ccache -s

      - name: 编译内核
        id: compile
        continue-on-error: true
        env:
          SKIP_PACKAGE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_COMMON_TOKEN: ${{ secrets.KERNEL_COMMON_TOKEN }}
          AK3_TOKEN: ${{ secrets.AK3_TOKEN }}
          ANDROID_VERSION: android13
          KERNEL_VERSION: '5.15'
          ANDROID_RELEASE: ${{ inputs.android_release }}
          DROIDSPACES_ENABLE: ${{ inputs.droidspaces_enable }}
          BUILD_SUSFS_MODE: ${{ inputs.susfs_mode }}
          CLANG_VERSION: ${{ inputs.clang_version }}
          COMMON_COMMIT: ${{ inputs.common_commit }}
          SKIP_APT: '1'
          SKIP_SOURCE_PREP: ${{ inputs.use_prepared_source && '1' || '' }}
          CCACHE_COMPILERCHECK: none
          CCACHE_NOHASHDIR: true
          CCACHE_NOHARDLINK: true
          CCACHE_IS_KERNEL_COMPILING: true
        run: |
          export CCACHE_LOGFILE="$GITHUB_WORKSPACE/kernel_workspace/ccache.log"
          mkdir -p "$(dirname "$CCACHE_LOGFILE")"
          chmod +x .github/workflows/all_managers/common.sh
          .github/workflows/all_managers/common.sh "${{ inputs.manager }}" "${{ inputs.kernel_suffix }}" "${{ inputs.susfs && 'on' || 'off' }}" "${{ inputs.use_kpn && 'true' || 'false' }}" "${{ inputs.version_name }}"
          echo "ccache 状态："
          ccache -s

      - name: 上传内核镜像
        if: ${{ steps.compile.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('kernel-Image-{0}{1}', inputs.manager == 'none' && 'noksu' || inputs.manager, (inputs.susfs_mode == 'both' && inputs.manager != 'none') && (inputs.susfs && '-susfs' || '-nosusfs') || '') }}
          path: ${{ github.workspace }}/kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image
          compression-level: 0

      - name: 删除旧 own 缓存
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh cache delete "${{ env.OWN_KEY }}" -R "${{ github.repository }}" 2>/dev/null; then
            echo "已删除旧 own 缓存"
          else
            echo "旧 own 缓存不存在，直接保存"
          fi

      - name: 保存 own ccache 缓存
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.OWN_KEY }}

      # 仅 none manager 写 common 缓存，避免多个矩阵 job 并发抢占同一 key
      - name: 保存 common ccache 缓存
        if: ${{ always() && inputs.use_prepared_source && inputs.manager == 'none' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.COMMON_KEY }}

      - name: 保存 ThinLTO 缓存
        if: ${{ always() && steps.restore-thinlto.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
          key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ inputs.manager }}

      - name: 保存工具链缓存
        if: ${{ always() && steps.cache-toolchains.outputs.cache-hit != 'true' && inputs.manager == 'none' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/clang14
            ${{ github.workspace }}/clang22
            ${{ github.workspace }}/clang23
          key: toolchains-${{ runner.os }}
      - id: record_clang_meta
        name: 记录 clang 版本元数据
        if: ${{ steps.compile.outcome == 'success' }}
        continue-on-error: true
        env:
          CLANG_VERSION_INPUT: ${{ inputs.clang_version }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/clang_meta"
          if [ "$CLANG_VERSION_INPUT" = "23" ]; then
            CLANG_BIN="$GITHUB_WORKSPACE/clang23/llvm-23/bin/clang"
          elif [ "$CLANG_VERSION_INPUT" = "14" ]; then
            CLANG_BIN="$GITHUB_WORKSPACE/clang14/clang-r450784d/bin/clang"
          else
            CLANG_BIN="$GITHUB_WORKSPACE/clang22/LLVM-22.1.0-Linux-X64/bin/clang"
          fi
          CLANG_LABEL_RAW="$($CLANG_BIN -v 2>&1 | grep 'clang version' | head -n 1)"
          CLANG_LABEL_VERSION="$(printf '%s' "$CLANG_LABEL_RAW" | grep -oE '[0-9]+(\.[0-9]+){0,2}' | head -n 1)"
          [ -n "$CLANG_LABEL_VERSION" ] || CLANG_LABEL_VERSION="$CLANG_VERSION_INPUT"
          printf '%s' "$CLANG_LABEL_VERSION" > "$GITHUB_WORKSPACE/clang_meta/version.txt"

      - name: 上传 clang 元数据工件
        if: ${{ steps.record_clang_meta.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: clang-meta-${{ inputs.manager }}
          path: ${{ github.workspace }}/clang_meta/version.txt

